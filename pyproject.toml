[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "anchored-returns"
version = "0.4.0"
description = "Source-linked utility ROE research and analysis tools"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Kazi Rafsan Mahboob"}]
dependencies = ["numpy>=1.26", "pymupdf>=1.24", "pandas>=2.2", "matplotlib>=3.9", "requests>=2.32", "openpyxl>=3.1", "scikit-learn>=1.5", "scipy>=1.15", "statsmodels>=0.14"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["src*", "scripts*"]

[tool.setuptools.package-data]
src = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
