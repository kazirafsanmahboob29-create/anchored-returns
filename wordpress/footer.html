o}}\n\n:host{display:block;font-size:15px;line-height:1.85;color:#30383e}[hidden]{display:none!important}.workbench{padding:28px 0;max-width:none}.workbench h1{font-size:27px;text-align:left}.workbench h2{font-size:24px;margin:0 0 16px}.workbench .source-bar h2{font-size:13px;margin:0 0 4px}.workbench .model-charts h2,.workbench section>h2{font-size:17px;margin-top:28px}.tool-nav{display:flex;flex-wrap:wrap;gap:8px;border-bottom:1px solid var(--line);padding-bottom:18px}.tool-nav button{border:0;border-bottom:2px solid transparent;border-radius:0;padding:9px 13px;color:#71808a}.tool-nav button[aria-pressed=true]{color:#345e78;border-color:#345e78}.workbench input[type=search],.workbench input[type=text],#rater-id{display:block;width:100%;padding:10px;border:1px solid #ccd6dd;background:white;font:inherit;color:inherit;margin-top:6px}#fact-results article,#source-results article{border-top:1px solid var(--line);padding:20px 0}#source-results h3{font-size:15px;margin:0 0 8px}#fact-results p,#source-results p{font-size:12px;margin:8px 0}code{overflow-wrap:anywhere}#source-results code{font-size:10px}#coding-unit blockquote{margin:20px 0;padding:15px 20px;border-left:2px solid #ccd6dd;background:#f8fafb;white-space:pre-wrap;font-size:14px}.coding-codes{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}#coding-unit textarea{display:block;width:100%;font:inherit;border:1px solid #ccd6dd;min-height:100px;padding:10px}#coding-unit pre{font-size:12px;white-space:pre-wrap;max-height:400px;overflow:auto}@media(max-width:600px){.tool-nav{gap:2px}.tool-nav button{font-size:11px;padding:8px}.workbench{padding:23px 0}.coding-codes{grid-template-columns:1fr 1fr}}"+'</style>'+"<div class=\"app-shell\"><nav class=\"tool-nav\" aria-label=\"Research tools\"><button data-view=\"models\" aria-pressed=\"true\">Models</button><button data-view=\"compare\" aria-pressed=\"false\">Period comparison</button><button data-view=\"regional\" aria-pressed=\"false\">Original orders</button><button data-view=\"sources\" aria-pressed=\"false\">Sources</button><button data-view=\"coding\" aria-pressed=\"false\">Coding worksheet</button></nav><section data-panel=\"models\" class=\"workbench\"><div class=\"workbench-title\"><div><p class=\"eyebrow\">DATA AND METHODS / 01</p><h1>Authorized-return model workbench</h1><p>Test the relationship between financial conditions, earlier awards and allowed returns.</p></div><a href=\"https://journeys.dartmouth.edu/kazirafsanmahboob29/files/2026/10/factor-study-wordpress-20261026.zip\" download>Download study \u2197</a></div>\n<section aria-labelledby=\"source-title\" class=\"source-bar\"><div><h2 id=\"source-title\">Data vintage</h2><p id=\"source-status\" role=\"status\">Loading the archived study.</p></div><div class=\"tool-actions\"><button id=\"refresh-factors\" disabled>Refresh Treasury and CPI</button><button id=\"use-archive\" disabled>Restore paper inputs</button></div></section>\n<p class=\"note\">The case table is EEI 2025 Q3. Refresh retrieves Treasury yield histories and CPI directly from their publishers. Financial stress remains at the paper\u2019s saved vintage. The recalculated model is a separate run; the paper and EEI case table remain fixed.</p>\n<form id=\"model-form\"><fieldset id=\"model-controls\" disabled><legend>Estimation settings</legend><div class=\"model-controls\"><label>First year<select id=\"model-start\"></select></label><label>Last year<select id=\"model-end\"></select></label><label>Case type<select id=\"model-type\"><option value=\"\">Both base-rate types</option><option>Distribution</option><option>Vertically Integrated</option></select></label><label>Specification<select id=\"model-spec\"><option value=\"market_case\">Market and case variables</option><option value=\"with_prior\">Add previous award</option><option value=\"state_year\" selected>State and year controls</option><option value=\"entity_year\">Utility-state and year controls</option></select></label><label>Market averaging window<select id=\"model-window\"><option value=\"90\">Prior 90 days</option><option value=\"30\">Prior 30 days</option></select></label><label>Scatterplot predictor<select id=\"model-x\"><option value=\"prior\">Previous recorded award</option><option value=\"treasury90\">10-year Treasury yield</option><option value=\"curve90\">Treasury term spread</option><option value=\"inflation\">CPI inflation</option><option value=\"stress\">Financial stress</option><option value=\"duration\">Filing duration</option></select></label></div><div class=\"tool-actions\"><button type=\"submit\" id=\"run-model\">Calculate model</button><button type=\"button\" id=\"reset-model\">Reset</button><button type=\"button\" id=\"share-model\">Copy selection link</button></div></fieldset></form>\n<p id=\"model-status\" class=\"note\" role=\"status\" aria-live=\"polite\"></p>\n<div class=\"model-summary\" id=\"model-summary\" aria-live=\"polite\"></div>\n<div class=\"model-charts\"><section aria-labelledby=\"scatter-title\"><h2 id=\"scatter-title\">Observed relationship</h2><div id=\"factor-scatter\"></div><p id=\"correlation-status\" class=\"note\"></p></section><section aria-labelledby=\"coefficient-title\"><h2 id=\"coefficient-title\">Adjusted coefficients</h2><div id=\"factor-coefficients\"></div><p class=\"note\">Dots are OLS coefficients; lines are 95% normal Wald intervals with two-way clustering by state and authorization quarter. Controls are included in the fit and omitted from the plot.</p></section></div>\n<section aria-labelledby=\"estimates-title\"><h2 id=\"estimates-title\">Estimates</h2><div class=\"table-wrap\"><table><thead><tr><th>Variable</th><th>Coefficient</th><th>95% interval</th><th>Units of change in the predictor</th></tr></thead><tbody id=\"factor-estimates\"></tbody></table></div><p class=\"note\">The outcome is ROE in percentage points. A coefficient of 0.10 means 10 basis points of associated ROE change per unit of the predictor. These coefficients are conditional associations, not causal effects.</p></section>\n<details><summary>Timing rules, exclusions and interpretation</summary><p>Every specification uses cases with an award, all four economic measures, a valid filing duration and a strictly earlier recorded award for the same exact utility-state label. This holds the estimation sample fixed when a predictor is added. The workbench reports the selected period's entries and complete observations separately.</p><p>Daily market windows end before authorization. CPI uses the reference month two months earlier and a twelve-month change. Financial stress uses the last observation at least fourteen days earlier. All histories use the retrieved vintage, including later revisions. This is a retrospective model.</p><p>Prior awards use the latest earlier authorization date within ten years. Multiple entries on that date are averaged; same-day observations never supply one another's prior award. Utility labels are inherited from the workbook. Persistence can reflect stable risk, policy or formula design as well as reliance on precedent. A lagged dependent variable with utility fixed effects can also have short-panel bias.</p><p>State controls account for persistent jurisdiction differences; year controls absorb common annual variation. That can remove much of the variation in national economic series, so a small adjusted Treasury slope is not evidence that interest rates have no effect. Selecting a narrower period can also leave too little independent variation to fit the requested model.</p><p>Financial stress is a broad St. Louis Fed index. The yield curve is a Treasury maturity spread. Neither measures a utility's equity risk premium. <a href=\"ar-file:docs/factor_analysis_plan_v0.1.0.md\">Analysis specification</a> \u00b7 <a href=\"ar-file:docs/factor_study.md\">Methods and results</a>.</p></details>\n<details><summary>Inspect included source observations</summary><p class=\"note\">Row IDs refer to the original EEI worksheet. The export includes every selected observation, missingness, economic timing and prior-row links.</p><div class=\"table-wrap record-scroll\"><table><thead><tr><th>Date / row</th><th>Utility / state</th><th>ROE</th><th>Prior award / date</th><th>Windowed Treasury</th><th>Filing years</th></tr></thead><tbody id=\"factor-records\"></tbody></table></div></details>\n<div class=\"tool-actions\"><button id=\"export-model\" disabled>Download calculation (JSON)</button><button id=\"export-panel\" disabled>Download selected rows (CSV)</button><button id=\"export-macro\" disabled>Download economic snapshot (JSON)</button></div>\n<section class=\"source-credit\"><h2>Source credits</h2><p><a href=\"https://www.eei.org/issues-and-policy/finance-and-tax\">Edison Electric Institute, Rate Review 2025 Q3</a>. Board of Governors, DGS10; Federal Reserve Bank of St. Louis, T10Y3M and STLFSI4; Bureau of Labor Statistics, CPIAUCNS, retrieved from <a href=\"https://fred.stlouisfed.org/\">FRED, Federal Reserve Bank of St. Louis</a>. <a href=\"https://api.bls.gov/publicAPI/v2/timeseries/data/\">Direct BLS API</a> validates CPI through a second retrieval route for the same series. Attribution does not imply endorsement.</p><p><a href=\"ar-file:data/external/factor_research_2026-10-26/publication_allowlist.json\">Series citations and source fingerprints</a> \u00b7 <a href=\"https://fred.stlouisfed.org/legal/\">FRED terms</a></p><div id=\"factor-source-links\"></div></section>\n</section><section data-panel=\"compare\" class=\"workbench\" hidden><p class=\"eyebrow\">EEI / 2010\u20132025 Q3</p><h2>Compare authorization periods</h2><p>Filter the national records and compare changes in awards and matched Treasury yields.</p><div class=\"comparison-tool\">\n<fieldset id=\"study-controls\" disabled><legend>Period comparison</legend>\n<div class=\"period-controls\"><div><span class=\"control-heading\">Earlier period</span><div class=\"year-pair\"><label>From<select id=\"study-a0\"></select></label><label>Through<select id=\"study-a1\"></select></label></div></div><div><span class=\"control-heading\">Later period</span><div class=\"year-pair\"><label>From<select id=\"study-b0\"></select></label><label>Through<select id=\"study-b1\"></select></label></div></div></div>\n<div class=\"other-controls\"><label>Jurisdiction<select id=\"study-state\"></select></label><label>Case type<select id=\"study-type\"><option value=\"\">Both base-rate types</option><option>Distribution</option><option>Vertically Integrated</option></select></label><label>Chart weighting<select id=\"study-weight\"><option value=\"case\">Each authorization</option><option value=\"state\">Common jurisdictions</option><option value=\"utility\">Common utilities within state</option></select></label></div>\n</fieldset>\n<div id=\"change-plot\" class=\"change-plot\" aria-live=\"polite\"></div><p id=\"comparison-note\" class=\"note\"></p>\n<div id=\"comparison-values\" class=\"table-wrap\" aria-live=\"polite\"></div>\n<div class=\"tool-actions\"><button id=\"study-reset\">Reset</button><button id=\"study-share\" disabled>Copy comparison link</button><button id=\"study-export\" disabled>Export records</button><button id=\"study-report\" disabled>Export report</button></div><p id=\"tool-status\" class=\"note\" role=\"status\">Loading the preserved national source records.</p>\n<details class=\"record-details\"><summary>Inspect the selected source observations</summary><p class=\"note\">Rows refer to the original <i>All Rate Cases 2025Q3</i> worksheet. An observation is a utility authorization, which may share a proceeding with other entries.</p><div class=\"table-wrap\"><table><thead><tr><th>Date</th><th>Utility and docket</th><th>Allowed ROE</th><th>Award minus request</th><th>Treasury</th><th>Workbook</th></tr></thead><tbody id=\"study-rows\"></tbody></table></div><div class=\"table-pagination\"><span id=\"study-page\"></span><div><button id=\"study-prev\" disabled>Previous</button><button id=\"study-next\" disabled>Next</button></div></div></details>\n</div>\n</section><section data-panel=\"regional\" class=\"workbench\" hidden><p class=\"eyebrow\">NEW ENGLAND / ORIGINAL DECISIONS</p><h2>Read the awards in context</h2><p>27 documents in the selected cohort. Primary orders, settlement approvals and formula implementations are identified separately. PDF page links open the preserved original decision.</p><div class=\"regional-tool\">\n<fieldset><legend>Original-order selection</legend><div class=\"regional-controls\"><label>Service<select id=\"regional-service\"><option value=\"\">Electric and gas</option><option>Electric</option><option>Gas</option></select></label><label>State<select id=\"regional-state\"><option value=\"\">All New England states</option><option>CT</option><option>MA</option><option>ME</option><option>NH</option><option>RI</option><option>VT</option></select></label><div class=\"stratum-checks\"><label class=\"check-label\"><input type=\"checkbox\" id=\"regional-settlements\"> Include approved settlements</label><label class=\"check-label\"><input type=\"checkbox\" id=\"regional-formulas\"> Include formula implementations</label></div></div></fieldset>\n<div class=\"table-wrap\"><table><thead><tr><th>State</th><th>Orders</th><th>Awards</th><th>Missing</th><th>Proceedings</th><th>Median</th><th>Observed range</th></tr></thead><tbody id=\"regional-summary\"></tbody></table></div>\n<p id=\"regional-status\" class=\"note\" role=\"status\" aria-live=\"polite\"></p>\n<details><summary>Plot and inspect the individual orders</summary><div id=\"regional-plot\" class=\"regional-plot\"></div><p class=\"note\">Filled circles are primary orders. Open circles are settlement approvals. Squares are formula implementations. The horizontal scale is the recorded allowed ROE. Missing awards are retained in the coverage table. Some orders share a proceeding; they are not independent experiments.</p><div class=\"table-wrap\"><table><thead><tr><th>State / date</th><th>   get('regional-plot').innerHTML=observed.length?`<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="Recorded allowed returns by state, date and docket. Each mark is an original order.">${[800,850,900,950,1000,1050,1100].map(v=>`<line x1="${x(v)}" x2="${x(v)}" y1="22" y2="${h-18}" stroke="#e6e9ec"/><text x="${x(v)}" y="13" text-anchor="middle" fill="#667681" font-size="11">${(v/100).toFixed(1)}%</text>`).join('')}${ordered.map((r,i)=>{const y=40+i*26;return `<text x="0" y="${y+4}" font-size="11" fill="#53636f">${escape(r.state+' '+r.order_date+' · '+r.docket.replace(/^(DE|DG) /,''))}</text>${r.stratum==='formula'?`<rect x="${x(r.award_bp)-4}" y="${y-4}" width="8" height="8" fill="#7d929f"><title>${escape(r.utility)}: ${pct(r.award_bp)} (formula)</title></rect>`:`<circle cx="${x(r.award_bp)}" cy="${y}" r="${r.stratum==='settlement'?4:4.5}" fill="${r.stratum==='settlement'?'white':'#345e78'}" stroke="#345e78"><title>${escape(r.utility)}: ${pct(r.award_bp)}${r.stratum==='settlement'?' (settlement)':''}</title></circle>`}<text x="${x(r.award_bp)+9}" y="${y+4}" font-size="10" fill="#345e78">${pct(r.award_bp)}</text>`}).join('')}</svg>`:'<p class="note">No entered awards for this selection.</p>';
  get('regional-records').innerHTML=rows.map(r=>`<tr><td>${escape(r.state)}<small>${escape(r.order_date)}</small></td><td>${escape(r.utility)}<small>${escape(r.docket)} · ${r.services.join(' / ')}${r.stratum==='settlement'?' · settlement':r.stratum==='formula'?' · formula':''}</small></td><td>${pct(r.award_bp)}</td><td>${r.award_page?`<a href="${assets.media[r.pdf_path]||r.source_url}#page=${r.award_page}">PDF p. ${r.award_page}</a>`:'No award entered'}</td></tr>`).join('');
  get('regional-export').onclick=()=>download(JSON.stringify({schema:data.schema,cohort_sha256:data.manifest_sha256,selection,summary,records:rows,note:data.note},null,2),'regional-selection.json','application/json');
  const url=new URL(location.href);url.hash='regional';for(const [k,v] of Object.entries(selection))url.searchParams.set('region_'+k,String(v));
  get('regional-share').onclick=async()=>{try{await navigator.clipboard.writeText(url.href);get('regional-status').textContent='Selection link copied.';}catch{get('regional-status').textContent='The browser could not copy this link.';}};
 }
 const params=new URL(location.href).searchParams;
 if(['','Electric','Gas'].includes(params.get('region_service')))get('regional-service').value=params.get('region_service');
 if(['',...states].includes(params.get('region_state')))get('regional-state').value=params.get('region_state');
 get('regional-settlements').checked=params.get('region_settlements')==='true';
 get('regional-formulas').checked=params.get('region_formulas')==='true';
 for(const id of ['regional-service','regional-state','regional-settlements','regional-formulas'])get(id).addEventListener('change',render);
 render();
}
})();
(()=>{const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function sources(){const query=$('source-search').value.trim().toLowerCase(),rows=assets.sources.filter(r=>[r.title,r.source_id,r.state,r.docket].join(' ').toLowerCase().includes(query));$('source-count').textContent=rows.length+' source records. Some documents support the study without belonging to the selected 27-order cohort.';$('source-results').innerHTML=rows.map(r=>'<article><h3>'+esc(r.title||r.source_id||r.pdf_path.split('/').at(-1))+'</h3><p>'+esc([r.source_id,r.state,r.docket,r.order_date].filter(Boolean).join(' · '))+'</p><p>'+esc(r.display_role)+'</p><p><a href="'+esc(r.local_url)+'" target="_blank" rel="noopener">Open document ↗</a>'+(r.source_url?' · <a href="'+esc(r.landing_url||r.source_url)+'" target="_blank" rel="noopener">Publisher record ↗</a>':'')+'</p>'+(r.pdf_sha256?'<p><code>SHA-256 '+esc(r.pdf_sha256)+'</code></p>':'')+'</article>').join('');}
$('source-search').addEventListener('input',sources);sources();
const storeKey='anchored-returns:ratings:'+assets.blank.packet_sha256;let ratings=structuredClone(assets.blank),position=0;
try{const saved=JSON.parse(localStorage.getItem(storeKey));if(saved?.packet_sha256===ratings.packet_sha256&&saved.ratings?.length===assets.packet.units.length)ratings=saved;}catch{}
$('rater-id').value=ratings.rater.identity||'';$('rater-independent').checked=ratings.rater.did_not_consult_reference_labels===true;
const labels={MKT:'Market / financial model',PEER:'Other regulatory awards',OWN:'Own earlier award',GRAD:'Gradualism',LAW:'Legal standard',CAP:'Capital attraction',RISK:'Risk',AFF:'Affordability',PERF:'Performance',DEF:'Deference to agreement',CONC:'Conclusory determination'};
function save(){ratings.rater.identity=$('rater-id').value.trim();ratings.rater.did_not_consult_reference_labels=$('rater-independent').checked;ratings.rater.started_at_utc??=new Date().toISOString();ratings.rater.kind='human';try{localStorage.setItem(storeKey,JSON.stringify(ratings));}catch{$('coding-status').textContent='Browser storage is unavailable. Export ratings to keep them.';}}
function renderUnit(){const unit=assets.packet.units[position],rating=ratings.ratings[position],count=ratings.ratings.filter(r=>Object.values(r.codes).every(v=>v===1||v===0)).length,source=assets.sources.find(s=>s.pdf_sha256===unit.pdf_sha256);$('coding-status').textContent='Unit '+(position+1)+' of '+assets.packet.units.length+' · '+count+' units fully rated. Saved locally in this browser.';$('coding-prev').disabled=position===0;$('coding-next').disabled=position===assets.packet.units.length-1;$('coding-unit').innerHTML='<h3>'+unit.unit_id+' · PDF '+(unit.pages.length===1?'page ':'pages ')+unit.pages.join(', ')+'</h3><p><a target="_blank" rel="noopener" href="'+esc(source?.local_url||unit.source_url)+'#page='+unit.pages[0]+'">Open source decision ↗</a></p><blockquote>'+esc(unit.text)+'</blockquote><details><summary>Read page context</summary>'+unit.context.map(c=>'<h4>PDF page '+c.page+'</h4><pre>'+esc(c.text)+'</pre>').join('')+'</details><div class="coding-codes">'+assets.packet.codes.map(code=>'<label>'+esc(code+' · '+labels[code])+'<select data-code="'+code+'"><option value="">Unset</option><option value="1"'+(rating.codes[code]===1?' selected':'')+'>Present</option><option value="0"'+(rating.codes[code]===0?' selected':'')+'>Absent</option></select></label>').join('')+'</div><label>Notes<textarea id="rating-note">'+esc(rating.notes)+'</textarea></label>';
for(const select of document.querySelectorAll('[data-code]'))select.addEventListener('change',()=>{rating.codes[select.dataset.code]=select.value===''?null:Number(select.value);save();});$('rating-note').addEventListener('input',()=>{rating.notes=$('rating-note').value;save();});}
for(const id of ['rater-id','rater-independent'])$(id).addEventListener('change',save);
$('coding-prev').addEventListener('click',()=>{position--;renderUnit();});$('coding-next').addEventListener('click',()=>{position++;renderUnit();});
$('coding-export').addEventListener('click',()=>{save();const complete=ratings.ratings.every(r=>Object.values(r.codes).every(v=>v===1||v===0));const attested=complete&&ratings.rater.identity&&ratings.rater.did_not_consult_reference_labels;ratings.rater.completed_at_utc=attested?new Date().toISOString():null;ratings.rater.notes=attested?'Completed through the browser coding worksheet.':'Draft worksheet. Completion requires all binary ratings, rater identity and independence attestation.';const url=URL.createObjectURL(new Blob([JSON.stringify(ratings,null,2)+'\n'],{type:'application/json'})),link=document.createElement('a');link.href=url;link.download='anchored-returns-ratings-'+(ratings.rater.identity.replace(/[^a-z0-9_-]/gi,'-')||'anonymous')+'.json';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);$('coding-status').textContent=(attested?'Complete':'Partial')+' ratings exported. Self-reported independence is recorded; export alone does not establish reliability.';});renderUnit();

function factSearch(){const q=$('fact-search').value.trim().toLowerCase(),rows=assets.facts.filter(r=>[r.case_id,r.field,r.notes,...r.spans.map(s=>s.exact_text)].join(' ').toLowerCase().includes(q));$('fact-count').textContent=rows.length+' matching facts'+(rows.length>15?'; showing the first 15. Narrow the search to find a specific passage.':'.');$('fact-results').innerHTML=rows.slice(0,15).map(r=>{const source=assets.sources.find(s=>s.pdf_sha256===r.pdf_sha256);return '<article><h4>'+esc(r.case_id+' · '+r.field.replaceAll('_',' '))+'</h4><p><strong>'+esc(r.value+' '+r.unit)+'</strong></p>'+r.spans.map(s=>'<p>“'+esc(s.exact_text)+'” <a href="'+esc(source?.local_url||source?.source_url)+'#page='+s.page+'" target="_blank" rel="noopener">PDF p. '+s.page+' ↗</a></p>').join('')+'<p>'+esc(r.notes)+'</p></article>';}).join('');}$('fact-search').addEventListener('input',factSearch);factSearch();
})();
const requested=new URL(location.href).searchParams.get('download');if(requested&&assets.files[requested]){showView('sources');const a=realDocument.createElement('a');a.href=fileUrl(requested);a.download=requested.split('/').at(-1);a.textContent='Download '+requested.split('/').at(-1);root.getElementById('source-results').prepend(a);}
}catch(error){host.textContent='The workbench could not load: '+error.message+'. The study download on the research page remains available.';console.error(error);}})();
</script>
