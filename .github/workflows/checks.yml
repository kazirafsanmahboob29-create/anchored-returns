name: Research checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  calculations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install -e '.[test]'
      - run: python -m scripts.check_links
      - run: python -m scripts.check_calculations
      - run: python -m src.prediction_audit --check
      - run: python -m src.expanded_study --check

  r-replication:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
      - run: Rscript analysis/factors.R reports/factor-study
      - run: Rscript analysis/prediction_audit.R reports/prediction-audit
      - run: Rscript analysis/expanded.R reports/expanded-study
