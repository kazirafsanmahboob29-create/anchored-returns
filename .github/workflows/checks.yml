name: Source and software checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  software:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install -e '.[test]'
      - run: python -m scripts.check_links
      - run: python -m scripts.check_public_release

# EEI-dependent numerical replication runs locally after source acquisition.
# This workflow does not claim to reproduce the published estimates from fixtures.
